version: 2
updates:
  - package-ecosystem: github-actions
    # "/" alone scans .github/workflows only. The composite actions every job
    # runs live under .github/actions, which is how pnpm/action-setup and
    # actions/cache sat on the deprecated Node 20 runtime unnoticed.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    # A compromised release is usually caught and yanked within days; not
    # proposing anything younger than a week keeps us out of that window.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']

  # Every dependency here is a dev dependency: both published packages ship
  # with none. Majors arrive on their own so each gets its own review.
  #
  # "/" alone covers every package in pnpm-workspace.yaml. Adding the package
  # directories would split updates away from the one root pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Closing a pull request only skips that one release, so a major we cannot
    # take comes back with its next patch unless it is ignored here.
    ignore:
      # Node's types must match the oldest Node in engines, or tests compile
      # against APIs CI lacks. Bump the major by hand when that floor moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 drops the JS compiler API that tsup --dts needs, so
      # `pnpm build` emits no .d.ts (#24). Remove once .d.ts is built another
      # way. 6.x stays open: it builds with ignoreDeprecations set to "6.0".
      - dependency-name: 'typescript'
        versions: ['>=7']
