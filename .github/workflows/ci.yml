name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Named so it is a stable status-check context. `main` does not require one
    # today, which is why release and deploy each re-run what they depend on;
    # doola-sdk-app's ruleset does require its four, and this is what a rule
    # here would name.
    name: Typecheck, tests and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-budgets.mjs
