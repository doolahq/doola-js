name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Named so it is a stable status-check context. `main` does not require one
    # today, which is why release and deploy each re-run what they depend on;
    # doola-sdk-app's ruleset does require its four, and this is what a rule
    # here would name.
    name: Typecheck, tests and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-budgets.mjs

      # After the build, because the suite drives the built IIFE — the artifact
      # partners load, not the sources. Chromium only: the suite tests this
      # loader against postMessage and iframe rules that are specified, so a
      # matrix would cover the browsers rather than the code.
      #
      # Cached on the resolved Playwright version, because the download is an
      # order of magnitude slower than the suite it enables. No `--with-deps`:
      # the ubuntu-latest image already carries Chromium's shared libraries,
      # and the apt half is the slow half.
      - id: playwright-version
        run: echo "v=$(pnpm --filter @doola/loader exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.v }}
      - run: pnpm --filter @doola/loader exec playwright install chromium
      - run: pnpm --filter @doola/loader test:browser
