name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm -r test
      - run: pnpm -r build
      - name: shim stays a shim (gzip < 3KB)
        run: |
          SIZE=$(gzip -c packages/js/dist/index.js | wc -c)
          echo "@doola/js esm gzip: ${SIZE} bytes"
          test "$SIZE" -lt 3072
