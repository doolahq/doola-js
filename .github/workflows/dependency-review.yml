name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails only on what a pull request introduces, not on alerts already on
      # main. High, not moderate: the published packages have no dependencies,
      # so everything this sees is build and test tooling.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
