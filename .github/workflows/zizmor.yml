name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings go to code scanning, which annotates only the lines a pull
      # request changes. In SARIF mode zizmor exits 0 whatever it finds, so a
      # green job is not a clean scan; check the tool:zizmor alerts instead.
      #
      # No `version` input on purpose: the default, `latest`, is a hash-pinned
      # lock inside the action, so each action SHA fixes the zizmor version and
      # Dependabot's bumps of the action move zizmor with it.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
