name: Release

# Publishes `@doola/js` and `@doola/sdk-protocol`. `@doola/loader` is
# `private: true`, so changesets skips it — it ships as a bundle instead, see
# deploy-loader.yml. The two-step version-PR flow and the one-time npm setup
# are docs/releasing.md.
on:
  push:
    branches: [main]

# One at a time and never cancelled: `changeset publish` walks the packages in
# dependency order, so a run killed midway can leave one published and the next
# not — a state no re-run can reach, because the first version number is now
# taken.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing here uses GITHUB_TOKEN. The branch push, the version pull request and
# the release tags all go through the doola-semantic-release GitHub App, the
# same identity partners-portal releases under.
permissions:
  contents: read

jobs:
  # Opens and updates the version pull request. Deliberately not gated: it
  # publishes nothing, needs no npm credential, and making someone approve the
  # opening of a pull request is how a gate becomes a reflex -- which is the
  # gate that matters below.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # The App rather than GITHUB_TOKEN, and not only for the shared identity:
      # a pull request opened with GITHUB_TOKEN triggers no workflows, so the
      # version pull request — the one whose diff is the versions about to be
      # published — would arrive with no CI having run on it.
      #
      # The App has no `workflows` permission, which is fine: `changeset version`
      # touches package.json, CHANGELOG.md and .changeset/ and nothing under
      # .github/.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Tags included: `changeset publish` skips a version whose tag it can
          # already see, and a shallow clone has none of them.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      # Re-run rather than trust CI: the two race on the same commit and `main`
      # requires no status check, so without this a red build publishes.
      - run: pnpm typecheck
      - run: pnpm test
      # Also what gets published: `release` deliberately does not rebuild, so
      # the artifact the budget gate measures is the artifact that ships.
      - run: pnpm build
      - run: node scripts/check-budgets.mjs

      # No `publish` input and no npm credential: this job only ever runs
      # `changeset version`. Publishing is the job below.
      - uses: changesets/action@v1
        id: changesets
        with:
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # The publish itself, behind the `production` Environment: its required
  # reviewer, and its branch policy pinning deployments to `main`.
  #
  # Gated because npm is the one irreversible step in this repo. A bad loader
  # deploy is a short cache TTL and a re-run; a bad publish is permanent in
  # every partner's lockfile, and a version number can never be reused.
  #
  # Runs on the push that leaves no changesets behind, which is the version
  # pull request being merged. `!= 'true'` rather than `== 'false'` so a
  # missing output errs towards running: `changeset publish` is a no-op when
  # every version in the tree is already on the registry, whereas a skipped job
  # is a release that silently shipped nothing.
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets != 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Tags included: `changeset publish` skips a version whose tag it can
          # already see, and a shallow clone has none of them.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      # Rebuilt here rather than carried from `version` as an artifact: this is
      # the tree `changeset publish` packs, so building it in the same job is
      # what keeps the bytes measured the bytes shipped.
      - run: pnpm build
      - run: node scripts/check-budgets.mjs

      # Home config, not the repo's `.npmrc`: a token in a tracked file is a
      # token in the history.
      #
      # Fails rather than warns. This job only runs when something is due to
      # publish, so a missing token is misconfiguration, most likely the secret
      # not being on this Environment, and a release that goes green having
      # published nothing is worse than a red one.
      - name: Authenticate to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is unset on the production Environment. See docs/releasing.md."
            exit 1
          fi

          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"

      # `publish` runs through pnpm, which is what makes the packages
      # installable at all: the `publishConfig` blocks rewrite `exports` from
      # TypeScript source to built `dist`, and plain `npm publish` ignores them.
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
